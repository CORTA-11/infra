name: Publish local runtime images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.local-setup
      - bootstrap-local.sh
      - Dockerfile.minio
      - minio-entrypoint.sh
      - .github/workflows/local-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: local-setup
            dockerfile: Dockerfile.local-setup
            version: core-9c8e5c2-v1
          - image: minio
            dockerfile: Dockerfile.minio
            version: source-7aac2a2-v1
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/corta-11/${{ matrix.image }}:${{ matrix.version }}
          labels: org.opencontainers.image.source=https://github.com/CORTA-11/infra
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
