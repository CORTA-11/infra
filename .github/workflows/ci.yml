name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Compose and Envoy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Create the external application network
        run: docker network create synodus-network
      - name: Validate Envoy configuration
        run: docker compose run --rm --no-deps envoy --mode validate -c /etc/envoy/envoy.yaml
