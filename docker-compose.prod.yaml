services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./jaeger.prod.yaml:/etc/jaeger/config.yaml:ro
      - jaeger_data:/tmp
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - synodus-network

  node-exporter:
    extends:
      file: docker-compose.yaml
      service: node-exporter

  prometheus:
    extends:
      file: docker-compose.yaml
      service: prometheus

  grafana:
    extends:
      file: docker-compose.yaml
      service: grafana


  envoy:
    image: envoyproxy/envoy:distroless-dev-9c085ba4a27fddea1811a8ecc98fc094dbdd455c
    restart: unless-stopped
    command: ["-c", "/etc/envoy/envoy.yaml"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs:/etc/envoy/certs:ro
    ports:
      - "80:10000"
      - "443:10443"
      - "127.0.0.1:9901:9901"
    depends_on:
      - web
      - api
      - socket-server
      - collaboration-server
    networks:
      - synodus-network
      - monitoring

  web:
    image: ghcr.io/corta-11/web-frontend:latest
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8080
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - synodus-network

  api:
    image: ghcr.io/corta-11/core-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6060:6060"
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-https://geeth.cf,https://www.geeth.cf,https://synodus.teshank.org,https://synodus.cse23.org}
      HTTP_TRUSTED_PROXY_CIDRS: ${HTTP_TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,127.0.0.1/32}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-appdb}
      REDIS_URL: redis://redis:6379/0
      REDIS_CHAT_CHANNEL: ${REDIS_CHAT_CHANNEL:-corta:chat:events}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-synodus-files}
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      CURSOR_KEY_ID: ${CURSOR_KEY_ID:-production-v1}
      CURSOR_SECRET: ${CURSOR_SECRET}
      COLLABORATION_SERVICE_SECRET: ${COLLABORATION_SERVICE_SECRET}
      COLLABORATION_INTERNAL_URL: ${COLLABORATION_INTERNAL_URL:-http://collaboration-server:8082}
      AI_SERVICE_URL: http://ai-service:8080
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-true}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-0.1}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      FIREBASE_CREDENTIALS_FILE: /run/secrets/firebase_service_account.json
    secrets:
      - source: db_runtime_password
        target: db_runtime_password.txt
      - source: minio_access_key
        target: minio_access_key
      - source: minio_secret_key
        target: minio_secret_key.txt
      - source: rate_limit_secret
        target: redis_limit_secret.txt
      - source: invitation_binding_secret
        target: redis_invitation_binding_secret.txt
      - source: csrf_secret
        target: csrf_secret.txt
      - source: firebase_service_account
        target: firebase_service_account.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - synodus-network

  ai-service:
    image: ghcr.io/corta-11/ai-service:latest
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - synodus-network

  socket-server:
    image: ghcr.io/corta-11/socket-server:latest
    restart: unless-stopped
    environment:
      PORT: "8081"
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379/0
      REDIS_CHAT_CHANNEL: ${REDIS_CHAT_CHANNEL:-corta:chat:events}
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-https://geeth.cf,https://www.geeth.cf,https://synodus.teshank.org,https://synodus.cse23.org}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - synodus-network

  collaboration-server:
    image: ghcr.io/corta-11/collaboration-server:latest
    restart: unless-stopped
    environment:
      COLLABORATION_HOST: 0.0.0.0
      COLLABORATION_PORT: "8082"
      CORE_API_INTERNAL_URL: http://api:8080
      COLLABORATION_SERVICE_SECRET: ${COLLABORATION_SERVICE_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379/0
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-https://geeth.cf,https://www.geeth.cf,https://synodus.teshank.org,https://synodus.cse23.org}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - synodus-network

  provisioner:
    image: ghcr.io/corta-11/core-api:latest
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/provisioner"]
    command: ["run"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-appdb}
      PROVISIONER_POLL_INTERVAL: ${PROVISIONER_POLL_INTERVAL:-5s}
      PROVISIONER_RETRY_INITIAL: ${PROVISIONER_RETRY_INITIAL:-5s}
      PROVISIONER_RETRY_MAXIMUM: ${PROVISIONER_RETRY_MAXIMUM:-5m}
      PROVISIONER_MAX_ATTEMPTS: ${PROVISIONER_MAX_ATTEMPTS:-5}
      PROVISIONER_CONCURRENCY: ${PROVISIONER_CONCURRENCY:-4}
      PROVISIONER_OPERATION_TIMEOUT: ${PROVISIONER_OPERATION_TIMEOUT:-2m}
      PROVISIONER_SHUTDOWN_TIMEOUT: ${PROVISIONER_SHUTDOWN_TIMEOUT:-10s}
    secrets:
      - source: db_provisioner_password
        target: db_provisioner_password.txt
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synodus-network

  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_admin_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_DB: ${DB_NAME:-appdb}
    secrets:
      - db_admin_user
      - db_admin_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_admin_user) -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - synodus-network

  redis:
    image: redis:8.8.1
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - synodus-network

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - synodus-network

networks:
  monitoring:
    driver: bridge
  synodus-network:
    name: synodus-network
    driver: bridge

volumes:
  jaeger_data:
  prometheus_data:
  grafana_data:
  postgres_data:
  redis_data:
  minio_data:

secrets:
  db_admin_user:
    file: ./secrets/db_admin_user.txt
  db_admin_password:
    file: ./secrets/db_admin_password.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  db_runtime_password:
    file: ./secrets/db_runtime_password.txt
  db_provisioner_password:
    file: ./secrets/db_provisioner_password.txt
  minio_access_key:
    file: ./secrets/minio_root_user.txt
  minio_secret_key:
    file: ./secrets/minio_root_password.txt
  rate_limit_secret:
    file: ./secrets/redis_limit_secret.txt
  invitation_binding_secret:
    file: ./secrets/redis_invitation_binding_secret.txt
  csrf_secret:
    file: ./secrets/csrf_secret.txt
  firebase_service_account:
    file: ./secrets/firebase_service_account.json
