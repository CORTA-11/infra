service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

extensions:
  healthcheckv2:
    use_v2: true
    http:
  jaeger_query:
    storage:
      traces: local_store
  jaeger_storage:
    backends:
      local_store:
        badger:
          directories:
            keys: /tmp/jaeger/
            values: /tmp/jaeger/
          ephemeral: false
          ttl:
            spans: 48h

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: local_store
