# Run with core-api/docker-compose.yaml; paths resolve from core-api.
services:
  local-setup:
    profiles: [setup]
    build:
      context: ../infra
      dockerfile: Dockerfile.local-tools
    volumes:
      - .:/src:ro
      - local_setup_go:/go/pkg/mod
      - local_setup_cache:/cache
    command:
      - make
      - CACHE_DIR=/cache
      - DB_HOST=postgres
      - DB_PORT=5432
      - MINIO_ENDPOINT=minio:9000
      - REDIS_HOST=redis
      - bootstrap-db
      - bootstrap
    networks:
      - internal

volumes:
  local_setup_go:
  local_setup_cache:
