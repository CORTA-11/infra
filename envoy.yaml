static_resources:
  listeners:
  - name: ingress
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          upgrade_configs:
          - upgrade_type: websocket
          route_config:
            name: application
            virtual_hosts:
            - name: application
              domains: ["*"]
              routes:
              - match:
                  path: "/ws/docs"
                route:
                  cluster: collaboration
              - match:
                  prefix: "/ws"
                route:
                  cluster: socket
              - match:
                  prefix: "/api/"
                route:
                  cluster: api
              - match:
                  prefix: "/"
                route:
                  cluster: web
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: api
    connect_timeout: 0.25s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: api
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: api
                port_value: 8080
  - name: web
    connect_timeout: 0.25s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: web
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: web
                port_value: 3000
  - name: socket
    connect_timeout: 0.25s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: socket
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: socket-server
                port_value: 8081
  - name: collaboration
    connect_timeout: 0.25s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: collaboration
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: collaboration-server
                port_value: 8082

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
