# Published images only. Run setup-local.sh to generate credentials and start.
services:
  api:
    image: ghcr.io/corta-11/core-api:sha-9c8e5c2
    restart: unless-stopped
    networks:
    - synodus-network
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-http://localhost:10000,http://127.0.0.1:10000,http://localhost:3000,http://127.0.0.1:3000}
      HTTP_TRUSTED_PROXY_CIDRS: ${HTTP_TRUSTED_PROXY_CIDRS:-}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:-appdb}
      REDIS_URL: redis://redis:6379/0
      REDIS_CHAT_CHANNEL: ${REDIS_CHAT_CHANNEL:-corta:chat:events}
      RATE_LIMIT_LOGIN_IP_LIMIT: ${RATE_LIMIT_LOGIN_IP_LIMIT:-20}
      RATE_LIMIT_LOGIN_IP_BURST: ${RATE_LIMIT_LOGIN_IP_BURST:-20}
      JWT_SECRET: ${JWT_SECRET:?Run setup-local.sh first}
      COLLABORATION_SERVICE_SECRET: ${COLLABORATION_SERVICE_SECRET:?Run setup-local.sh
        first}
      COLLABORATION_INTERNAL_URL: http://collaboration-server:8082
      AI_SERVICE_URL: http://ai-service:8080
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Run setup-local.sh first}
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-synodus-files}
      MINIO_USE_SSL: 'false'
      CURSOR_KEY_ID: ${CURSOR_KEY_ID:-development-v1}
      CURSOR_SECRET: ${CURSOR_SECRET:?Run setup-local.sh first}
      PPROF_ENABLED: 'false'
    secrets:
    - &id001
      source: db_runtime_password
      target: db_runtime_password.txt
    - &id002
      source: minio_access_key
      target: minio_access_key
    - &id003
      source: minio_secret_key
      target: minio_secret_key.txt
    - &id004
      source: rate_limit_secret
      target: redis_limit_secret.txt
    - &id005
      source: invitation_binding_secret
      target: redis_invitation_binding_secret.txt
    - &id006
      source: csrf_secret
      target: csrf_secret.txt
    depends_on:
      provisioner:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:8080/health/ready
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
  ai-service:
    image: ghcr.io/corta-11/ai-service:sha-d832155
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Run setup-local.sh first}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready',
        timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
    - synodus-network
  socket-server:
    image: ghcr.io/corta-11/socket-server:sha-b7e5ba3
    restart: unless-stopped
    environment:
      PORT: '8081'
      JWT_SECRET: ${JWT_SECRET:?Run setup-local.sh first}
      REDIS_URL: redis://redis:6379/0
      REDIS_CHAT_CHANNEL: ${REDIS_CHAT_CHANNEL:-corta:chat:events}
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-http://localhost:10000,http://127.0.0.1:10000,http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      redis:
        condition: service_healthy
    networks:
    - synodus-network
  collaboration-server:
    image: ghcr.io/corta-11/collaboration-server:sha-b7e5ba3
    restart: unless-stopped
    environment:
      COLLABORATION_HOST: 0.0.0.0
      COLLABORATION_PORT: '8082'
      CORE_API_INTERNAL_URL: http://api:8080
      REDIS_URL: redis://redis:6379/0
      COLLABORATION_SERVICE_SECRET: ${COLLABORATION_SERVICE_SECRET:?Run setup-local.sh
        first}
      JWT_SECRET: ${JWT_SECRET:?Run setup-local.sh first}
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-http://localhost:10000,http://127.0.0.1:10000,http://localhost:3000,http://127.0.0.1:3000}
      COLLABORATION_AUTHENTICATION_TIMEOUT_MS: ${COLLABORATION_AUTHENTICATION_TIMEOUT_MS:-60000}
      COLLABORATION_DEPENDENCY_TIMEOUT_MS: ${COLLABORATION_DEPENDENCY_TIMEOUT_MS:-2000}
      COLLABORATION_MAX_WEBSOCKET_MESSAGE_BYTES: ${COLLABORATION_MAX_WEBSOCKET_MESSAGE_BYTES:-6291456}
      COLLABORATION_MAX_DOCUMENT_BYTES: ${COLLABORATION_MAX_DOCUMENT_BYTES:-6291456}
      COLLABORATION_MAX_BACKPRESSURE_BYTES: ${COLLABORATION_MAX_BACKPRESSURE_BYTES:-8388608}
      COLLABORATION_MAX_AUTHENTICATED_QUEUE_BYTES: ${COLLABORATION_MAX_AUTHENTICATED_QUEUE_BYTES:-12582912}
      COLLABORATION_MAX_AUTHENTICATED_QUEUE_MESSAGES: ${COLLABORATION_MAX_AUTHENTICATED_QUEUE_MESSAGES:-64}
      COLLABORATION_MAX_UNAUTHENTICATED_QUEUE_BYTES: ${COLLABORATION_MAX_UNAUTHENTICATED_QUEUE_BYTES:-262144}
      COLLABORATION_MAX_UNAUTHENTICATED_QUEUE_MESSAGES: ${COLLABORATION_MAX_UNAUTHENTICATED_QUEUE_MESSAGES:-64}
      COLLABORATION_MAX_PENDING_DOCUMENTS: ${COLLABORATION_MAX_PENDING_DOCUMENTS:-1}
      COLLABORATION_MAX_PERSISTENCE_RESPONSE_BYTES: ${COLLABORATION_MAX_PERSISTENCE_RESPONSE_BYTES:-16777216}
      COLLABORATION_PERSISTENCE_DEBOUNCE_MS: ${COLLABORATION_PERSISTENCE_DEBOUNCE_MS:-2000}
      COLLABORATION_PERSISTENCE_MAX_DEBOUNCE_MS: ${COLLABORATION_PERSISTENCE_MAX_DEBOUNCE_MS:-10000}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - synodus-network
  provisioner:
    image: ghcr.io/corta-11/core-api:sha-9c8e5c2
    restart: unless-stopped
    entrypoint:
    - /usr/local/bin/provisioner
    command:
    - run
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:-appdb}
      PROVISIONER_POLL_INTERVAL: ${PROVISIONER_POLL_INTERVAL:-5s}
      PROVISIONER_RETRY_INITIAL: ${PROVISIONER_RETRY_INITIAL:-5s}
      PROVISIONER_RETRY_MAXIMUM: ${PROVISIONER_RETRY_MAXIMUM:-5m}
      PROVISIONER_MAX_ATTEMPTS: ${PROVISIONER_MAX_ATTEMPTS:-5}
      PROVISIONER_CONCURRENCY: ${PROVISIONER_CONCURRENCY:-4}
      PROVISIONER_OPERATION_TIMEOUT: ${PROVISIONER_OPERATION_TIMEOUT:-2m}
      PROVISIONER_SHUTDOWN_TIMEOUT: ${PROVISIONER_SHUTDOWN_TIMEOUT:-10s}
    secrets:
    - source: db_provisioner_password
      target: db_provisioner_password.txt
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - synodus-network
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_admin_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_DB: ${DB_NAME:-appdb}
    secrets:
    - db_admin_user
    - db_admin_password
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$(cat /run/secrets/db_admin_user) -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
    - postgres_data:/var/lib/postgresql
    networks:
    - synodus-network
  redis:
    image: redis:8.8.1
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
    - redis_data:/data
    networks:
    - synodus-network
  minio:
    image: ghcr.io/corta-11/minio:source-7aac2a2-v1
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
    - minio_root_user
    - minio_root_password
    volumes:
    - minio_data:/data
    command: server --console-address ":9001" /data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/ready
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
    - synodus-network
    restart: unless-stopped
    ports:
    - 127.0.0.1:9001:9001
  web:
    image: ghcr.io/corta-11/web-frontend:sha-43a9c71
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8080
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
    - synodus-network
  local-setup:
    image: ghcr.io/corta-11/local-setup:core-9c8e5c2-v1
    profiles:
    - setup
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-http://localhost:10000,http://127.0.0.1:10000,http://localhost:3000,http://127.0.0.1:3000}
      HTTP_TRUSTED_PROXY_CIDRS: ${HTTP_TRUSTED_PROXY_CIDRS:-}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:-appdb}
      REDIS_URL: redis://redis:6379/0
      REDIS_CHAT_CHANNEL: ${REDIS_CHAT_CHANNEL:-corta:chat:events}
      RATE_LIMIT_LOGIN_IP_LIMIT: ${RATE_LIMIT_LOGIN_IP_LIMIT:-20}
      RATE_LIMIT_LOGIN_IP_BURST: ${RATE_LIMIT_LOGIN_IP_BURST:-20}
      JWT_SECRET: ${JWT_SECRET:?Run setup-local.sh first}
      COLLABORATION_SERVICE_SECRET: ${COLLABORATION_SERVICE_SECRET:?Run setup-local.sh
        first}
      COLLABORATION_INTERNAL_URL: http://collaboration-server:8082
      AI_SERVICE_URL: http://ai-service:8080
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Run setup-local.sh first}
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-synodus-files}
      MINIO_USE_SSL: 'false'
      CURSOR_KEY_ID: ${CURSOR_KEY_ID:-development-v1}
      CURSOR_SECRET: ${CURSOR_SECRET:?Run setup-local.sh first}
      PPROF_ENABLED: 'false'
    secrets:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - source: db_admin_user
      target: db_admin_user.txt
    - source: db_admin_password
      target: db_admin_password.txt
    - source: db_migrator_password
      target: db_migrator_password.txt
    - source: db_provisioner_password
      target: db_provisioner_password.txt
    networks:
    - synodus-network
  node-exporter:
    extends:
      file: docker-compose.yaml
      service: node-exporter
  prometheus:
    extends:
      file: docker-compose.yaml
      service: prometheus
  grafana:
    extends:
      file: docker-compose.yaml
      service: grafana
  envoy:
    image: envoyproxy/envoy:distroless-dev-9c085ba4a27fddea1811a8ecc98fc094dbdd455c
    restart: unless-stopped
    command:
    - -c
    - /etc/envoy/envoy.yaml
    volumes:
    - ./envoy.local.yaml:/etc/envoy/envoy.yaml:ro
    ports:
    - 127.0.0.1:9901:9901
    - ${SYNODUS_BIND_ADDRESS:-127.0.0.1}:10000:10000
    networks:
    - synodus-network
    - monitoring
networks:
  synodus-network:
    driver: bridge
  monitoring:
    driver: bridge
volumes:
  postgres_data: null
  redis_data: null
  minio_data: null
  prometheus_data: null
  grafana_data: null
secrets:
  db_admin_user:
    file: ./secrets/db_admin_user.txt
  db_admin_password:
    file: ./secrets/db_admin_password.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  db_runtime_password:
    file: ./secrets/db_runtime_password.txt
  db_provisioner_password:
    file: ./secrets/db_provisioner_password.txt
  minio_access_key:
    file: ./secrets/minio_access_key
  minio_secret_key:
    file: ./secrets/minio_secret_key.txt
  rate_limit_secret:
    file: ./secrets/redis_limit_secret.txt
  invitation_binding_secret:
    file: ./secrets/redis_invitation_binding_secret.txt
  csrf_secret:
    file: ./secrets/csrf_secret.txt
  db_migrator_password:
    file: ./secrets/db_migrator_password.txt
name: synodus-local
